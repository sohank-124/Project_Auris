# ============================================================================
# Project Auris - Main CI Pipeline
# ----------------------------------------------------------------------------
# Runs on every push to main and every pull request targeting main.
#
# Job graph (arrows = "needs"):
#
#   lint-sv ─┐
#   lint-py ─┼─► build-fpga
#   lint-md ─┘                │
#                            run-tools (parallel)
#                            ci-pass (always, last)
#
# Note: lint-c / build-esp32 jobs were removed during the FPGA-only migration
# (Phase 5 cleanup, 2026-08). The firmware/ tree is archived under archive/.
#
# Concurrency: any in-progress run on the same ref is cancelled when a new
# commit is pushed (or a new PR push occurs). This saves CI minutes.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref on new pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs that need write access opt in explicitly.
permissions:
  contents: read

# ----------------------------------------------------------------------------
# Global environment: selected lint/Python versions; apt Verilator is not pinned.
# ----------------------------------------------------------------------------
env:
  PYTHON_VERSION: "3.11"
  VERILATOR_VERSION: "5.020"           # apt package; bump if a newer one is needed
  VERIBLE_VERSION: "v0.0-4296-g0f262651" # chipsalliance/verible release tag
  # IDF_VERSION removed in Phase 5 (FPGA-only migration, 2026-08)

jobs:
  # ==========================================================================
  # Lint: SystemVerilog (Verible)
  # ==========================================================================
  lint-sv:
    name: Lint SystemVerilog (Verible)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verible is not packaged in Ubuntu; pull a prebuilt static binary
      # from the upstream chipsalliance/verible release. The "linux-static"
      # artifact is a self-contained tarball that does not need root install.
      - name: Install Verible
        run: |
          set -euo pipefail
          ASSET="verible-${VERIBLE_VERSION}-linux-static-x86_64"
          URL="https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/${ASSET}.tar.gz"
          echo "Downloading ${URL}"
          curl -fsSL -o verible.tar.gz "${URL}"
          mkdir -p "${RUNNER_TEMP}/verible"
          tar -xzf verible.tar.gz -C "${RUNNER_TEMP}/verible" --strip-components=1
          echo "${RUNNER_TEMP}/verible/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/verible/bin/verible-verilog-lint" --version

      # Glob the entire RTL tree. Keep all rules enabled except these existing
      # conventions and packaging exceptions:
      #   -line-length                         : dense DSP math can exceed 80 chars
      #   -module-filename                     : sub-folder packaging does not always match module names
      #   -parameter-name-style                : existing localparam names use lowercase
      #   -unpacked-dimensions-range-ordering  : existing arrays use explicit [0:N-1] ranges
      #   -always-ff-non-blocking               : self-test helper variables use blocking assignments
      #   -posix-eof                           : three existing RTL files lack a final newline
      - name: Run verible-verilog-lint
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # Collect file list explicitly so the command stays readable.
          FILES=(fpga/rtl/**/*.sv)
          echo "Linting ${#FILES[@]} SystemVerilog files"
          verible-verilog-lint \
            --rules=-line-length,-module-filename,-parameter-name-style,-unpacked-dimensions-range-ordering,-always-ff-non-blocking,-posix-eof \
            "${FILES[@]}"

  # ==========================================================================
  # Lint: Python (ruff)
  # ==========================================================================
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install --quiet "ruff==0.6.9"

      - name: ruff check
        run: ruff check tools/

      - name: ruff format --check
        run: ruff format --check tools/

  # ==========================================================================
  # Lint: Markdown (markdownlint-cli2)
  # ==========================================================================
  lint-markdown:
    name: Lint Markdown (markdownlint-cli2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            ENGINEERING_DESIGN.md
            docs/**/*.md
            hardware/**/*.md
            tools/README.md

  # ==========================================================================
  # Build: FPGA lint (Verilator)
  # ==========================================================================
  build-fpga:
    name: Lint FPGA (Verilator)
    needs: [lint-sv]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y verilator
          verilator --version

      # Vendor interfaces are lint-only declarations, never functional models.
      - name: Verilator lint top.sv
        run: |
          set -euo pipefail
          mapfile -t RTL < <(find fpga/rtl -name '*.sv' ! -name auris_pkg.sv | sort)
          verilator --lint-only -Wall -Wno-fatal \
            -Ifpga/rtl -Ifpga/rtl/pkg \
            --top-module top \
            fpga/rtl/pkg/auris_pkg.sv \
            fpga/sim/lint/vendor_interfaces.sv "${RTL[@]}"

  # ==========================================================================
  # Run: Python toolchain (coefficient / table generators)
  # ==========================================================================
  run-tools:
    name: Run Python tool generators
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The generators write into fpga/generated/ which is gitignored.
      # We create it here so the verification step below can find the files.
      - name: Generate Hann window coefficients
        run: |
          set -euo pipefail
          mkdir -p fpga/generated
          python tools/win_gen/gen_hann_coeffs.py \
            --out-prefix fpga/generated/hann_256

      - name: Generate default gain tables
        run: |
          set -euo pipefail
          python tools/profile_gen/gen_default_tables.py

      # Sanity-check that the generators actually produced their outputs.
      # These are inspection/release outputs, not active RTL initialization inputs.
      - name: Verify generated artifacts exist
        run: |
          set -euo pipefail
          REQUIRED=(
            fpga/generated/hann_256.coe
            fpga/generated/hann_256.hex
            fpga/generated/hann_256.json
            fpga/generated/gain_table_general.hex
            fpga/generated/gain_table_speech.hex
            fpga/generated/gain_table_hearing.hex
            fpga/generated/gain_table_music.hex
            fpga/generated/gain_tables_manifest.json
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Missing or empty generated artifact"
              MISSING=1
            else
              echo "OK  $f ($(wc -c < "$f") bytes)"
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "One or more generated artifacts are missing."
            exit 1
          fi

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-tables
          path: fpga/generated/
          retention-days: 14

  # ==========================================================================
  # ci-pass: aggregate gate that fails the workflow if any required job failed
  # ==========================================================================
  ci-pass:
    name: CI gate
    needs:
      - lint-sv
      - lint-python
      - lint-markdown
      - build-fpga
      - run-tools
    # Always run so the workflow reports a single green/red status even if a
    # previous job was skipped (e.g. via `if: false` on a draft PR).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate overall CI status
        run: |
          set -euo pipefail
          # Map of job name -> conclusion. The `needs()` context exposes the
          # result of each declared dependency.
          declare -A STATUS=(
            ["lint-sv"]="${{ needs.lint-sv.result }}"
            ["lint-python"]="${{ needs.lint-python.result }}"
            ["lint-markdown"]="${{ needs.lint-markdown.result }}"
            ["build-fpga"]="${{ needs.build-fpga.result }}"
            ["run-tools"]="${{ needs.run-tools.result }}"
          )

          FAILED=()
          for job in "${!STATUS[@]}"; do
            case "${STATUS[$job]}" in
              success)
                echo "PASS  $job"
                ;;
              skipped)
                # Skipped jobs are treated as PASS for the gate. We only fail
                # on actual failures.
                echo "SKIP  $job"
                ;;
              *)
                echo "FAIL  $job (${STATUS[$job]})"
                FAILED+=("$job")
                ;;
            esac
          done

          if [ "${#FAILED[@]}" -ne 0 ]; then
            echo ""
            echo "CI FAILED. The following jobs did not pass:"
            printf '  - %s\n' "${FAILED[@]}"
            exit 1
          fi
          echo ""
          echo "All CI jobs passed."
