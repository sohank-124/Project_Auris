# ============================================================================
# Project Auris - Documentation Validation
# ----------------------------------------------------------------------------
# Two jobs:
#   1. markdown-lint  : keeps prose style consistent (MD013/MD041/etc.)
#   2. link-check     : catches broken links before they hit the rendered site
#
# The mkdocs-build job is intentionally left commented out until the docs
# site is ready to be published to GitHub Pages. Flip the `if` and remove
# the `# ` prefix to enable it.
# ============================================================================

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**.md"
      - "hardware/**/*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**.md"
      - "hardware/**/*.md"
      - ".github/workflows/docs.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Markdown style / structure
  # ==========================================================================
  markdown-lint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          # Lint every .md file in the tree. A .markdownlint.json (or
          # .markdownlint-cli2.jsonc) at the repo root customises the rules.
          globs: |
            **/*.md

  # ==========================================================================
  # Broken-link detection
  # ==========================================================================
  link-check:
    name: Lychee link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lycheeverse/lychee-action@v2 supports the `args` input as a
      # single string. We exclude:
      #   * mailto: links (not useful to crawl)
      #   * digilent.com — vendor site, occasionally blocks bots
      #   * ti.com       — vendor site, rate-limits CI runners
      # --no-progress keeps the log readable in the Actions UI.
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-mail
            --exclude digilent.com
            --exclude ti.com
            --accept 200,203,206,301,302,303,307,308,403,410
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # MkDocs build (disabled — enable when ready to publish to Pages)
