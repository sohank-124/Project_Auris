name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**.md"
      - "hardware/**"
      - "archive/documentation/**"
      - "tools/validation/check_repository.py"
      - ".gitignore"
      - ".gitattributes"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Public documentation and evidence paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check local links, test registration and evidence checksums
        run: python -B tools/validation/check_repository.py
      - name: Lint maintained Markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
            CHANGELOG.md
            CONTRIBUTING.md
            ENGINEERING_DESIGN.md
            docs/**/*.md
            hardware/**/*.md
            tools/README.md
